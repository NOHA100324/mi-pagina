<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infotec.pe | Premium Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <div class="container header-main">
        <a href="#" class="logo">infotec<span>.pe</span></a>
        
        <div class="search-box">
            <input type="text" id="buscador" placeholder="Busca tu próxima laptop..." onkeyup="buscarProducto()">
        </div>

        <div class="user-cart-actions">
            <button class="action-btn" onclick="abrirModalLogin()">
                <span class="icon">👤</span>
                <div style="text-align: left; line-height: 1;">
                    <small id="user-status" style="font-size: 10px; color: var(--text-muted);">Bienvenido</small><br>
                    <strong id="user-action" style="font-size: 13px;">Mi Cuenta</strong>
                </div>
            </button>
            
            <button class="action-btn cart-btn" onclick="toggleCarrito()">
                <span class="icon">🛒</span>
                <strong id="cart-total-nav">S/ 0.00</strong>
            </button>
        </div>
    </div>
</header>

<nav class="main-nav">
    <div class="container nav-links">
        <a href="#" class="active">patatas ricas</a>
        <a href="#">PC Gamer</a>
        <a href="#">Componentes</a>
        <a href="#">Monitores</a>
        <a href="#">Accesorios</a>
    </div>
</nav>

<main class="container main-layout">
    <aside class="sidebar">
        <h3>Categorías</h3>
        <ul class="filter-list">
            <li>Laptops Gaming</li>
            <li>MacBooks</li>
            <li>Ultrabooks</li>
            <li>Workstations</li>
        </ul>
    </aside>

    <section class="content-area">
        <div id="admin-controls"></div>
        <div id="catalogo" class="product-grid">
            <!-- Productos cargados por JS -->
        </div>
    </section>
</main>

<!-- MODALES -->
<div id="login-modal" class="modal" onclick="cerrarModalFuera(event, 'login-modal')">
    <div class="modal-content">
        <h3>Acceso Administrativo</h3>
        <input type="text" id="login-user" placeholder="Usuario">
        <input type="password" id="login-pass" placeholder="Contraseña">
        <button class="btn-primary" onclick="login()">Iniciar Sesión</button>
        <button class="btn-secondary" onclick="cerrarModalLogin()">Cancelar</button>
    </div>
</div>

<div id="admin-modal" class="modal" onclick="cerrarModalFuera(event, 'admin-modal')">
    <div class="modal-content">
        <h3 id="admin-modal-title">Gestionar Producto</h3>
        <input type="hidden" id="prod-id">
        <input type="text" id="prod-nombre" placeholder="Nombre del producto">
        <input type="number" id="prod-precio" placeholder="Precio (S/)">
        <input type="text" id="prod-img" placeholder="URL de la imagen">
        <input type="text" id="prod-marca" placeholder="Marca">
        <input type="number" id="prod-stock" placeholder="Stock Inicial">
        <button class="btn-primary" onclick="guardarProducto()">Guardar Cambios</button>
        <button class="btn-secondary" onclick="cerrarModalAdmin()">Cancelar</button>
    </div>
</div>

<div id="payment-modal" class="modal" onclick="cerrarModalFuera(event, 'payment-modal')">
    <div class="modal-content">
        <h3>Finalizar Compra</h3>
        <div style="display: flex; flex-direction: column; gap: 10px; margin: 20px 0;">
            <button class="btn-primary" onclick="procesarPago('Tarjeta')">Pagar con Tarjeta 💳</button>
            <button class="btn-primary" style="background: var(--dark);" onclick="procesarPago('Transferencia')">Transferencia Bancaria 🏦</button>
        </div>
        <button class="btn-secondary" onclick="cerrarModalPago()">Volver</button>
    </div>
</div>

<div id="cart-drawer" class="cart-drawer">
    <div class="cart-header">
        <h3>Tu Carrito</h3>
        <button onclick="toggleCarrito()" style="background:none; border:none; font-size:24px; cursor:pointer;">✕</button>
    </div>
    <div id="carrito-items" class="cart-content"></div>
    <div class="cart-footer">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <strong>Total:</strong>
            <strong id="cart-total-final" style="font-size:20px; color:var(--blue);">S/ 0.00</strong>
        </div>
        <button class="btn-primary" onclick="abrirModalPago()">PAGAR AHORA</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
